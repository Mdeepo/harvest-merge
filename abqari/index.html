<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b35"><title>عبقري+ | ساحة الأبطال</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#203e78,#0b1227 70%);color:#fff;font-family:system-ui,Tahoma,sans-serif;min-height:100vh}main{max-width:560px;margin:auto;padding:18px}header,.stats,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:900;font-size:27px}.muted{color:#9eb4d9;font-size:13px}.card{background:#152543;border:1px solid #34486d;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 12px 40px #0003}h1{font-size:27px;margin:10px 0}h2{font-size:21px}.pill{background:#253e65;border-radius:14px;padding:10px;text-align:center;flex:1}.pill strong{display:block;color:#7ee9d6;font-size:22px}button{border:0;border-radius:14px;background:linear-gradient(120deg,#25cbb4,#3c91fa);padding:15px;color:#08152b;font-weight:900;font-size:16px;cursor:pointer;width:100%;margin:6px 0}button.secondary{background:#253b60;color:white;border:1px solid #4c6389}button.option{text-align:right;background:#1b3154;color:#fff;border:1px solid #45618a}button.option:disabled{opacity:.75}button.good{background:#166a4c}button.bad{background:#803b4e}.bar{height:9px;background:#293a58;border-radius:20px;overflow:hidden}.bar i{display:block;background:#3bdac5;height:100%;transition:.3s}.hide{display:none}.big{font-size:52px;text-align:center}.tag{color:#76ead7;font-size:13px;font-weight:800}footer{text-align:center;color:#8398b8;font-size:12px;margin:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button{height:92px}.explain{background:#1b3b43;border-radius:12px;padding:12px;line-height:1.8}</style><main><header><div class="logo">🧠 عبقري<span style="color:#4be2cd">+</span></div><span class="muted">ساحة الأبطال ⚔️</span></header><section class="card"><div class="row"><div><div class="muted">مرحبًا يا بطل 👋</div><h1 id="rank">المستكشف الذكي</h1></div><div style="font-size:42px">🏆</div></div><div class="stats"><div class="pill">💎 <strong id="gems">0</strong><span class="muted">جواهر</span></div><div class="pill">⚡ <strong id="xp">0</strong><span class="muted">خبرة</span></div><div class="pill">🎯 <strong id="wins">0</strong><span class="muted">انتصارات</span></div></div></section><section id="home" class="card"><div class="tag">اختر مغامرتك</div><h2>جاهز تثبت إنك عبقري؟ 🔥</h2><p class="muted">أسئلة قدرات كمي ولفظي، مكافآت حقيقية داخل اللعبة، وتحدي ضد خصم افتراضي.</p><div class="grid"><button onclick="start('mix')">🧠 تدريب شامل</button><button onclick="start('speed')">⏱️ تحدي السرعة</button><button onclick="start('math')">🔢 قدرات كمي</button><button onclick="start('word')">📚 قدرات لفظي</button></div><button class="secondary" onclick="start('battle')">⚔️ مواجهة البطل الافتراضي</button></section><section id="quiz" class="card hide"><div class="row"><span class="tag" id="mode"></span><span class="muted" id="count"></span></div><h2 id="question"></h2><div class="bar"><i id="progress"></i></div><p class="muted" id="timer"></p><div id="options"></div><div id="explain" class="explain hide"></div><button id="next" class="hide" onclick="next()">التالي ←</button></section><section id="result" class="card hide"><div class="big" id="medal">🏆</div><h1 style="text-align:center">انتهى التحدي!</h1><h2 style="text-align:center" id="score"></h2><p style="text-align:center" id="reward"></p><button onclick="show('home')">العودة لساحة الأبطال</button><button class="secondary" onclick="start(kind)">العب مرة تانية 🔁</button></section><footer>نسخة تجريبية مجانية • حفظ التقدم على جهازك • الأسئلة تدريبية أصلية</footer></main><script>const bank=[['كمي','إذا كان سعر 3 أقلام 18 ريالًا، فما سعر 7 أقلام؟',['36','42','48','54'],1,'القلم 6 ريالات؛ 7 × 6 = 42.'],['لفظي','اختر الكلمة المختلفة:',['تفاح','موز','جزر','برتقال'],2,'الجزر من الخضراوات.'],['كمي','ما التالي: 2، 6، 12، 20، 30؟',['40','42','44','46'],1,'الفروق 4، 6، 8، 10، ثم 12.'],['لفظي','قلم : كتابة :: فرشاة : ؟',['ورق','رسم','كتاب','مكتبة'],1,'الفرشاة أداة للرسم.'],['كمي','80% من 45 تساوي:',['34','36','38','40'],1,'0.8 × 45 = 36.'],['لفظي','ضد كلمة شجاع:',['مقدام','جبان','جريء','باسل'],1,'الجبان عكس الشجاع.'],['كمي','إذا كان س + 7 = 19، فإن س =',['10','11','12','13'],2,'19 - 7 = 12.'],['لفظي','أي الكلمات أقرب لمعنى مثابر؟',['كسول','مواظب','متردد','منعزل'],1,'المثابر هو المواظب.'],['كمي','محيط مربع طول ضلعه 9 سم:',['18','27','36','81'],2,'المحيط = 4 × 9 = 36.'],['لفظي','طبيب : مستشفى :: معلم : ؟',['مدرسة','ملعب','مزرعة','مصنع'],0,'المعلم يعمل في المدرسة.'],['كمي','نصف العدد 86:',['41','42','43','44'],2,'86 ÷ 2 = 43.'],['لفظي','أي الكلمات جمع تكسير؟',['معلمون','طالبات','كتب','مهندسون'],2,'كتب جمع تكسير لكلمة كتاب.']];let state=JSON.parse(localStorage.getItem('abqari-state')||'{"xp":0,"gems":0,"wins":0}'),pool=[],idx=0,correct=0,locked=false,kind='mix',deadline=0,tick;const el=id=>document.getElementById(id);function save(){localStorage.setItem('abqari-state',JSON.stringify(state));el('xp').textContent=state.xp;el('gems').textContent=state.gems;el('wins').textContent=state.wins;el('rank').textContent=state.xp>=500?'أسطورة القدرات':state.xp>=200?'محارب المعرفة':'المستكشف الذكي'}function show(id){['home','quiz','result'].forEach(x=>el(x).classList.toggle('hide',x!==id));clearInterval(tick)}function start(k){kind=k;pool=bank.filter(x=>k==='math'?x[0]==='كمي':k==='word'?x[0]==='لفظي':true).sort(()=>Math.random()-.5).slice(0,5);idx=0;correct=0;deadline=Date.now()+(k==='speed'?90000:999999999);show('quiz');tick=setInterval(()=>{if(kind==='speed'){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));el('timer').textContent='⏱️ الوقت المتبقي: '+left+' ثانية';if(!left)finish()}},300);render()}function render(){locked=false;let q=pool[idx];el('mode').textContent=kind==='battle'?'⚔️ مواجهة افتراضية':kind==='speed'?'⏱️ سباق الوقت':q[0]==='كمي'?'🔢 قدرات كمي':'📚 قدرات لفظي';el('count').textContent=(idx+1)+' / '+pool.length;el('question').textContent=q[1];el('progress').style.width=((idx+1)/pool.length*100)+'%';el('options').innerHTML='';q[2].forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=['أ','ب','ج','د'][i]+' — '+o;b.onclick=()=>answer(i);el('options').appendChild(b)});el('explain').classList.add('hide');el('next').classList.add('hide');el('next').textContent=idx===pool.length-1?'شوف نتيجتك 🏆':'السؤال التالي ←'}function answer(i){if(locked)return;locked=true;let q=pool[idx];if(i===q[3])correct++;[...el('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('good');else if(j===i)b.classList.add('bad')});el('explain').textContent=(i===q[3]?'🎉 إجابة صحيحة! ':'💡 الإجابة الصحيحة: '+q[2][q[3]]+'. ')+q[4];el('explain').classList.remove('hide');el('next').classList.remove('hide')}function next(){idx++;if(idx>=pool.length)finish();else render()}function finish(){clearInterval(tick);let earned=correct*20,gem=correct*5;state.xp+=earned;state.gems+=gem;if(correct>=3)state.wins++;save();el('medal').textContent=correct===5?'👑':correct>=3?'🏆':'🎯';el('score').textContent=correct+' / '+pool.length+' إجابات صحيحة';el('reward').textContent='ربحت '+earned+' XP و '+gem+' 💎'+(kind==='battle'?' • خصمك كان افتراضيًا':'');show('result')}save();</script></html>
