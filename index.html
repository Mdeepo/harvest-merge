<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#3b8d53"><title>Harvest Merge 🌾</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#b5eafa,#e6f7cf);font-family:system-ui,sans-serif;color:#385331;min-height:100vh}.wrap{max-width:490px;margin:auto;padding:12px}header,.order{background:#fff8da;border:3px solid #c7a66c;border-radius:18px;padding:12px;box-shadow:0 5px 0 #b18b53;display:flex;justify-content:space-between;align-items:center;gap:8px}header h1{font-size:23px;margin:0;color:#39804b}.stats{font-size:14px;font-weight:800}.order{margin:14px 0;background:#fff3cb}.order strong{font-size:30px}.order small{display:block;color:#7b7d58}.game{border:9px solid #9b673e;border-radius:25px;overflow:hidden;background:#e8edc3;box-shadow:0 8px 0 #694529}canvas{display:block;width:100%;height:auto;touch-action:none}.buttons{display:flex;justify-content:center;gap:9px;margin:17px 0}button{background:#ffcb53;border:3px solid #b98630;border-radius:14px;padding:11px 14px;font-weight:800;color:#62491f;cursor:pointer}.hint{text-align:center;font-size:13px;font-weight:700}.overlay{position:fixed;inset:0;background:#172a17c9;display:none;place-items:center;padding:20px}.overlay.show{display:grid}.dialog{background:#fff9e2;border:5px solid #b99155;border-radius:20px;text-align:center;padding:25px;max-width:360px}.dialog p{line-height:1.7}
</style></head><body><main class="wrap"><header><h1>🌾 Harvest Merge</h1><div class="stats">⭐ <span id="score">0</span> &nbsp; 🪙 <span id="coins">0</span></div></header><section class="order"><div><b>📦 Farm Order</b><small>Merge the requested fruit for coins!</small></div><strong id="orderFruit">🍅</strong><b id="reward">+45 🪙</b></section><div class="game"><canvas id="c" width="420" height="570"></canvas></div><div class="buttons"><button id="reset">🔄 Restart</button><button id="help">❔ How to play</button><button id="sound">🔊</button></div><p class="hint">Drag to aim, release to drop • Match fruits to merge!</p></main><div id="overlay" class="overlay"><div class="dialog"><h2 id="title">Harvest Merge</h2><p id="body"></p><button id="close">OK 🌱</button></div></div><script>
(()=>{const c=document.getElementById("c"),g=c.getContext("2d"),W=420,H=570,fruit=["🍒","🍓","🍅","🍋","🍊","🍎","🍐","🍉","🎃","🍍"],radii=[17,22,28,34,40,47,55,64,75,86],$=id=>document.getElementById(id);let balls=[],score=0,coins=0,order=2,next=0,aim=210,ready=true,over=false,mute=false,last=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function ui(){$("score").textContent=score;$("coins").textContent=coins;$("orderFruit").textContent=fruit[order];$("reward").textContent="+"+(order+1)*15+" 🪙"}function save(){try{localStorage.setItem("harvest_merge_game",JSON.stringify({balls,score,coins,order,next}))}catch{}}function load(){try{const x=JSON.parse(localStorage.getItem("harvest_merge_game"));if(x&&Array.isArray(x.balls)){balls=x.balls.filter(b=>Number.isFinite(b.x)&&Number.isFinite(b.y)&&b.t>=0&&b.t<10).map(b=>({...b,vx:0,vy:0,age:1000}));score=x.score||0;coins=x.coins||0;order=x.order||2;next=x.next||0}}catch{}ui()}function restart(){balls=[];score=coins=0;order=2;next=0;ready=true;over=false;ui();save();$("overlay").classList.remove("show")}function show(title,body){$("title").textContent=title;$("body").textContent=body;$("overlay").classList.add("show")}function beep(freq){if(mute)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),v=a.createGain();o.connect(v);v.connect(a.destination);o.frequency.value=freq;v.gain.setValueAtTime(.06,a.currentTime);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.start();o.stop(a.currentTime+.14);setTimeout(()=>a.close(),400)}catch{}}function drop(){if(!ready||over)return;const t=next,r=radii[t];balls.push({x:clamp(aim,r+5,W-r-5),y:48,t,vx:0,vy:0,age:0});next=Math.floor(Math.random()*Math.min(4,2+Math.floor(score/400)));ready=false;setTimeout(()=>ready=true,400);beep(330);save()}function merge(a,b){if(a.t!==b.t||a.t>=9)return false;const t=a.t+1;balls.splice(balls.indexOf(a),1);balls.splice(balls.indexOf(b),1);balls.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,t,vx:0,vy:-2,age:0});score+=t*15;if(t===order){coins+=(order+1)*15;order=1+Math.floor(Math.random()*Math.min(8,3+Math.floor(score/500)));beep(880)}else beep(490+t*35);ui();save();return true}function tick(dt){let step=Math.min(dt/16.67,2);for(const b of balls){b.age+=dt;b.vy=Math.min(9,b.vy+.3*step);b.x+=b.vx*step;b.y+=b.vy*step;b.vx*=.985;const r=radii[b.t];if(b.x<r+4){b.x=r+4;b.vx=Math.abs(b.vx)*.3}if(b.x>W-r-4){b.x=W-r-4;b.vx=-Math.abs(b.vx)*.3}if(b.y>H-r-5){b.y=H-r-5;b.vy=Math.min(0,-b.vy*.1);b.vx*=.8}}for(let pass=0;pass<3;pass++){let merged=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,dist=radii[a.t]+radii[b.t]+1;if(d<dist){if(a.t===b.t&&a.age>100&&b.age>100){merge(a,b);merged=true;break outer}const nx=dx/d,ny=dy/d,p=(dist-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){a.vx+=rv*nx*.18;a.vy+=rv*ny*.18;b.vx-=rv*nx*.18;b.vy-=rv*ny*.18}}}if(!merged&&pass===2)break}if(balls.some(b=>b.y-radii[b.t]<75&&b.age>3500)){over=true;save();show("Game Over 🌻","You scored "+score+" points and earned "+coins+" coins. Tap Restart to play again!")}}function draw(){g.clearRect(0,0,W,H);g.fillStyle="#eaf0c6";g.fillRect(0,0,W,H);g.fillStyle="#e3eab7";for(let y=90;y<H;y+=38)g.fillRect(0,y,W,2);g.strokeStyle="#df8576";g.lineWidth=3;g.setLineDash([8,8]);g.beginPath();g.moveTo(0,75);g.lineTo(W,75);g.stroke();g.setLineDash([]);g.textAlign="center";g.textBaseline="middle";for(const b of balls){const r=radii[b.t];g.beginPath();g.arc(b.x,b.y,r,0,Math.PI*2);g.fillStyle=["#f6c5d2","#f4b3c2","#f5b59a","#f9d78b","#ffbd7b","#f4a8a3","#e7ec9c","#f4b6a9","#f3bc81","#f5d989"][b.t];g.fill();g.strokeStyle="#ffffffb0";g.lineWidth=3;g.stroke();g.font=Math.round(r*1.4)+"px serif";g.fillText(fruit[b.t],b.x,b.y+1)}if(ready&&!over){const r=radii[next];g.globalAlpha=.3;g.strokeStyle="#3d8351";g.setLineDash([5,7]);g.beginPath();g.moveTo(aim,40);g.lineTo(aim,H);g.stroke();g.setLineDash([]);g.globalAlpha=1;g.beginPath();g.arc(aim,39,r,0,Math.PI*2);g.fillStyle="#fff8db";g.fill();g.font=Math.round(r*1.4)+"px serif";g.fillText(fruit[next],aim,39)}}function frame(t){let dt=last?Math.min(34,t-last):16;last=t;if(!over)tick(dt);draw();requestAnimationFrame(frame)}function point(e){const rect=c.getBoundingClientRect();aim=clamp((e.clientX-rect.left)*W/rect.width,radii[next]+5,W-radii[next]-5)}c.addEventListener("pointerdown",e=>{point(e);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")point(e)});c.addEventListener("pointerup",e=>{point(e);drop()});document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){aim=clamp(aim-22,20,400);e.preventDefault()}if(e.key==="ArrowRight"){aim=clamp(aim+22,20,400);e.preventDefault()}if(e.key===" "||e.key==="Enter"){drop();e.preventDefault()}});$("reset").onclick=restart;$("help").onclick=()=>show("How to play 🌱","Drag your finger to choose where to drop a fruit. Release to drop it. Two matching fruits merge into a larger fruit. Fulfill farm orders to earn coins. Don't let the pile reach the red line!");$("close").onclick=()=>$("overlay").classList.remove("show");$("sound").onclick=()=>{$("sound").textContent=(mute=!mute)?"🔇":"🔊"};load();setInterval(save,5000);requestAnimationFrame(frame)})();
</script></body></html>
